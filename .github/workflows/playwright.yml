name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Verify required secrets
        env:
          TALTEK_API_TOKEN: ${{ secrets.TALTEK_API_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          missing=()

          [ -z "$TALTEK_API_TOKEN" ] && missing+=("TALTEK_API_TOKEN")
          [ -z "$DB_HOST" ] && missing+=("DB_HOST")
          [ -z "$DB_PORT" ] && missing+=("DB_PORT")
          [ -z "$DB_USER" ] && missing+=("DB_USER")
          [ -z "$DB_PASSWORD" ] && missing+=("DB_PASSWORD")
          [ -z "$DB_NAME" ] && missing+=("DB_NAME")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

          echo "All required secrets are configured."

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          # Non-secret QA application URL
          TALTEK_BASE_URL: https://qa.taltektc.com

          # API secret
          TALTEK_API_TOKEN: ${{ secrets.TALTEK_API_TOKEN }}

          # Database secrets
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30